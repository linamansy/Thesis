# Central configuration for the thesis experiment.
# All parameters live here and are loaded in code; nothing is hard-coded.

model:
  # The ONE model of the experiment, read by BOTH the BPMN generator (BPMNGen) and the C3 mediation agents.
  # Thesis decision (16 Oct 2026): the agents use the SAME model as the generator, so C3 cannot win by borrowing a
  # stronger model. Settings that only the agents send are under "llm"; BPMNGen's own fixed values are stated
  # under generator.expected and checked against every BPMNGen request.
  provider: ollama            # "mock" (fixed answers, no API), "ollama" (local model, used for the thesis),
                              # "gemini" or "anthropic" (both kept for possible later use, e.g. a robustness check);
                              # API keys are in .env. The silver annotator has its own section (silver, below).
  name: qwen3:8b              # a FIXED model version; for Ollama the exact file is fixed by ollama_model_digest
  ollama_model_digest: 500a1f067a9f782620b40bee6f7b0c89e17ae61f686b92c24933e4ca4b2b8b41  # qwen3:8b, pulled 18 Oct 2026; from `ollama list` / the Ollama API; the run stops if the installed model differs
  ollama_url: http://localhost:11434
  ollama_server_env:          # settings of the Ollama SERVER (Windows user environment variables; restart Ollama after
                              # a change). Checked when a run starts and stored in run_info.json; a run with other
                              # values is refused. Decided 18 Oct 2026: with these, qwen3:8b at num_ctx 16384 fits
                              # 100% on the RTX 4060 GPU (without them 20% ran on the CPU, about 4x slower).
    OLLAMA_FLASH_ATTENTION: "1"
    OLLAMA_KV_CACHE_TYPE: q8_0
  num_ctx: 16384              # context window in tokens (prompt + answer). The agents send it; BPMNGen fixes the same
                              # value in its own code (checked against every BPMNGen request), so Ollama never reloads
  think: false                # Qwen3 thinking (hidden reasoning) off. Agents: think:false in every request. Generator:
                              # the harness adds Ollama's think:false to BPMNGen's request (decided 18 Oct 2026):
                              # BPMNGen asks for no thinking with "/no_think", but Ollama 0.40.6 let qwen3 think anyway
                              # (hidden, unsaved, once an endless loop). Stored in run_info.json
  bpmngen_module: tools/ai/opensource  # BPMNGen's Ollama generator class, loaded by the harness (relative to
  bpmngen_class: OpenSourceLLM         # generator.bpmngen_server_dir)
  ollama_info_timeout_seconds: 30      # GET /api/tags and /api/version (model digest, Ollama version)

llm:
  # Settings that ONLY the C3 mediation agents (and the legacy JSON generator) send. The model is under "model".
  temperature: 0              # mediation agents (BPMNGen keeps its own fixed 0.3, see generator.expected)
  max_tokens: 8192            # longest answer allowed (Ollama: num_predict)
  seed: 42                    # Ollama: fixed random seed
  ollama_timeout_seconds: 900 # Ollama: longest wait for one answer (a local model can be slow)
  ollama_api_max_retries: 5   # OllamaLLM: extra attempts when Ollama is not reachable, times out or has a server error
  max_retries: 1              # extra attempts when the LLM output is not valid JSON for the schema (BaseAgent)
  api_initial_wait_seconds: 2 # wait before the first API retry; doubles each time (2, 4, 8, ... s)
  api_max_retries: 5          # AnthropicLLM: extra attempts on temporary API errors
  gemini_api_max_retries: 5   # GeminiLLM: extra attempts on 429/RESOURCE_EXHAUSTED, overload, server errors, timeouts
  gemini_pause_between_calls_seconds: 10  # GeminiLLM: minimum seconds between two calls (free-tier per-minute limit)

generator:
  # The ONE BPMN generator shared by C1, C2 and C3. Its model is under "model".
  type: bpmngen               # "bpmngen" (thesis: BPMNGen + Ollama via bpmngen_harness) or "json_builder"
                              # (legacy: own prompt -> JSON -> src/bpmn_builder.py; used by the mock tests)
  # BPMNGen is private Ulm code: it lives OUTSIDE this repository and is never committed or changed.
  bpmngen_server_dir: ../BPMNGen-backend-main/BPMNGen-backend-main/server  # relative to the project root, or absolute
  harness: bpmngen_harness/run_bpmngen.ts
  bpmngen_mode: quick         # BPMNGen's generation mode and output format, as in a new BPMNGen thread
  bpmngen_format: xml         # (the Ollama class always writes XML)
  expected:                   # BPMNGen's OWN fixed request values (set in its code, not changeable here). Every BPMNGen
                              # request is checked against them and against model.name / num_ctx / think; any
                              # difference stops the run as a setup error (not a model result). Values = Study 1.
    temperature: 0.3
    system_prompt_sha256: 3b5a338e433e98cc9f7c935eee23f93e3cf8779c694aca658f5ee280137657d7  # SHA-256 (UTF-8) of
                              # BPMNGen's system message, identical in all 117 Study 1 requests
  # BPMNGen files hashed (SHA-256, read only) when a run starts and stored in run_info.json as bpmngen_file_hashes
  # (audit 19 Oct 2026). Every other BPMNGen file the harness loads is added automatically (harness --list-files).
  # A run stops if the hashes differ from an earlier part of the same run, or from another run of the same study
  # (the runs listed in statistics.runs). Paths are relative to bpmngen_server_dir.
  bpmngen_hashed_files: [tools/ai/opensource.ts, tools/ai/ai.ts, tools/utils/xml-validator.ts, environment.ts]
  bpmngen_key_libraries: [bpmnlint, bpmn-moddle]  # every installed version of these (any depth) goes into
                              # run_info.json bpmngen_library_versions, together with node/npm and all direct
                              # dependencies (read only: npm ls; src/bpmngen_libraries.py)
  npm_command: null           # null = find npm automatically; set a full path if needed
  bpmngen_hash_exclude: [.env]  # BPMNGen's secrets file (API keys); its contents change for reasons unrelated to the
                                # generator. The harness sets the variables the Ollama path uses (run_bpmngen.ts, step 2)
  # Neutral label in front of the knowledge block, identical for C1, C2 and C3 (PROVISIONAL: agree with
  # supervisors / Ulm). Replaces BPMNGen's DMN label "...rules the generated process MUST follow".
  # The knowledge block of C1 is in prompts/c1_no_knowledge.txt, the C3 layout in prompts/c3_block_template.json.
  knowledge_label: "[Domain information (it may or may not apply to this process):]"
  timeout_seconds: 900        # per case (8B model on an RTX 4060, ~42 tokens/s: a full 16384-token window takes ~6.5 min).
                              # On timeout the whole process tree is killed and the case is a FAILED generation
                              # (timed_out = True), scored, never retried
  npx_command: null           # null = find npx automatically; set a full path if needed

mediation:
  # C3 mediation version (fix C2, 19 Oct 2026). v1 = Study 1 (git tag c3-v1-study1 = commit aa1ca1e). The SHA-256 of
  # every C3 prompt part (agent prompts, output schemas, retry note, block template) is stored in c3_hashes_file;
  # tests/test_c3_frozen.py and the preflight fail if anything differs (src/c3_version.py).
  c3_version: v1
  c3_hashes_file: tests/c3_v1_hashes.json

silver:
  # Automatic legal reference for EVALUATION only (src/build_silver_reference.py), complete before the evaluation.
  # Deliberately a different, stronger model than the generator and the C3 agents (qwen3), so C3 is not graded
  # by its own model. AI-made = SILVER (provisional); decision 16 Oct 2026: no human audit (stated limitation).
  # Changed 19 Oct 2026, before any evaluation: gemini-3.6-flash -> openai/gpt-oss-120b via Groq, because the
  # Gemini free tier allows only 20 requests/day and paid billing was not possible (65 calls are needed).
  provider: groq              # "groq" (GROQ_API_KEY in .env) or "gemini" (GEMINI_API_KEY, gemini_* settings in llm)
  model: openai/gpt-oss-120b  # every answer must report exactly this name, otherwise the build stops
  temperature: 0
  max_tokens: 5000            # Groq counts prompt + max_tokens against its 8000 tokens/minute free limit when a request
                              # arrives; the largest silver prompt is ~2000 tokens, so 5000 keeps every request under it
  groq_base_url: https://api.groq.com/openai/v1
  groq_timeout_seconds: 120
  groq_api_max_retries: 5     # extra attempts on server errors and timeouts (waits 2, 4, 8, ... s)
  groq_max_rate_limit_wait_seconds: 900  # 429 rate limit: wait as Groq asks (not a failure); a longer requested wait
                                         # means the daily limit (1000 requests/day) is used up -> stop, resume later
  groq_max_rate_limit_waits: 100         # safety stop: one call that keeps getting 429 is given up after this many waits

experiment:
  repetitions: 3              # each condition is run this many times: --repetition 1, 2, 3
                              # finish C1, C2 and C3 of a repetition before starting the next one

cases:
  ids: ["01", "03", "05", "06", "10", "11", "13", "17", "19", "21", "37", "45", "46"]

conditions: ["C1", "C2", "C3"]

chunking:
  max_passage_chars: 1500   # longer passages are split by their lettered points (src/retrieval/chunker.py)

retrieval:
  dense_model: intfloat/e5-small-v2   # small English embedding model
  passage_prefix: "passage: "         # e5 models require these prefixes
  query_prefix: "query: "
  bm25_k1: 1.5
  bm25_b: 0.75
  stopwords_language: english         # NLTK stopword list
  top_k_per_retriever: 20             # candidates taken from each retriever before fusion
  rrf_k: 60                           # Reciprocal Rank Fusion constant: score = sum of 1 / (rrf_k + rank)
  final_top_k: 5                      # passages kept per case (used when retrieval is frozen)

evaluation:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2  # embeds task labels for matching
  similarity_threshold: 0.75   # main threshold: tasks match only if cosine similarity >= this. Fixed before
                               # evaluation, not calibrated; sensitivity sweep reported (sensitivity_thresholds)
  sensitivity_thresholds: [0.70, 0.75, 0.80, 0.85]  # used by: python -m src.evaluate --sweep
  smoke_run_prefix: smoke      # runs whose id starts with this are test runs: excluded from all summaries
  message_flows_as_order: true # message flows (between pools) count as "before/after" in the behavioral profile;
                               # BPMNGen draws one pool per actor, the PMo references use one process
  trace_threshold: 0.5         # FIXED before the real runs (18 Oct 2026): an extra (unmatched) generated task counts as
                               # "knowledge-traceable" if its label is at least this similar to a sentence of the
                               # knowledge block AND more similar to it than to any sentence of the description
  trace_sensitivity_thresholds: [0.4, 0.5, 0.6]  # sensitivity check of trace_threshold, also run by --sweep
  extended_scoring_status: "PROVISIONAL until the Study 2 analysis-plan addendum is committed"  # src/extended_scoring.py
  trace_min_sentence_chars: 15 # pieces of the knowledge block / description shorter than this are not used as
                               # sentences in the trace check (headings, list markers)

statistics:
  # docs/ANALYSIS_PLAN.md sections 1-5, fixed before any evaluation (src/statistics.py)
  runs: [ollama_rep1, ollama_rep2, ollama_rep3]
  primary_metrics: [f1, behavioral_similarity]
  planned_comparisons: [[C3, C1], [C3, C2]]     # two-sided Wilcoxon; Holm over 2 metrics x 2 comparisons
  descriptive_comparisons: [[C2, C1]]           # effect sizes only, no test
  alpha: 0.05
  bootstrap_resamples: 10000                    # bootstrap 95% CI of the median paired difference
  bootstrap_seed: 42
  secondary_metrics: [precision, recall, valid, precision_adjusted, requirement_coverage, n_extra_tasks,
                      n_extra_knowledge_traceable, n_unjustified_knowledge_additions]
  overapplication_metric: n_unjustified_knowledge_additions
  overapplication_comparison: [C3, C2]          # difference C3 minus C2
  complexity_measures: [ref_flow_nodes, ref_cfc]  # of the PMo reference model (RQ2, exploratory)
  round_decimals: 10                            # case means and paired differences are rounded to this many
                                                # decimals, so floating-point noise cannot create fake ranks or ties
  tables:                                       # output file names in paths.statistics_dir
    primary_tests: rq1_primary_tests.csv
    descriptive: rq1_descriptive.csv
    overapplication: rq1_overapplication.csv
    rq2_spearman: rq2_spearman.csv
    rq2_case_effects: rq2_case_effects.csv
    valid_or_rescued_tests: secondary_valid_or_rescued_tests.csv
    failure_types: failure_types.csv

paths:
  pmo_raw: data/raw/pmo
  pmo_descriptions: data/raw/pmo/descriptions
  pmo_bpmn: data/raw/pmo/bpmn
  cases: data/cases                       # one folder per case: data/cases/<id>/
  case_description_file: description.txt  # file name inside each case folder
  case_reference_file: reference.bpmn     # file name inside each case folder
  knowledge_raw: data/knowledge/raw
  knowledge_sources: data/knowledge/sources.json
  passages: data/knowledge/passages.jsonl
  frozen_retrieval: data/retrieval/frozen_retrieval.json
  dense_index_dir: data/retrieval/dense_index   # FAISS index + the passage ids it contains
  nltk_data: data/nltk_data                     # NLTK stopword list is downloaded here (not committed)
  generator_prompt: prompts/generator_prompt.txt       # legacy json_builder generator only (BPMNGen has its own prompt)
  relevance_prompt: prompts/relevance_prompt.txt       # C3 mediation agents
  applicability_prompt: prompts/applicability_prompt.txt
  requirement_prompt: prompts/requirement_prompt.txt
  silver_prompt: prompts/silver_annotation_prompt.txt  # evaluation reference only, NOT a C3 agent
  c1_no_knowledge: prompts/c1_no_knowledge.txt         # the knowledge block of C1 (same label and place as C2/C3)
  c3_block_template: prompts/c3_block_template.json    # layout of the C3 knowledge block (src/orchestrator.py)
  json_retry_note: prompts/json_retry_note.json        # added to an agent prompt after an invalid JSON answer
  silver_reference: data/silver/silver_reference.json  # built once by src/build_silver_reference.py, then frozen
  mock_silver_response: data/mock/silver_response.json
  mock_generator_response: data/mock/sample_process.json  # fixed answer MockLLM gives the generator
  mock_relevance_response: data/mock/relevance_response.json          # fixed answers for the C3 agents
  mock_applicability_response: data/mock/applicability_response.json
  mock_requirement_response: data/mock/requirement_response.json
  env_file: .env                          # holds GROQ_API_KEY (silver annotator); GEMINI_API_KEY / ANTHROPIC_API_KEY
                                          # only if those providers are used (never committed)
  knowledge_block_file: knowledge_block.txt  # per case: the exact knowledge text given to the generator
  runs: results/runs                      # one folder per run: results/runs/<run_id>/<condition>/<case_id>/
  run_info_file: run_info.json            # per run: repetition, provider, model, conditions run
  mediation_dir: mediation                # C3 only: results/runs/<run_id>/C3/mediation/
  mediation_summary_file: run_summary.json  # C3 only: counts over the mediation files of a run, in mediation_dir
  bpmngen_output_dir: bpmngen             # per case: everything the harness wrote (results/runs/.../<case_id>/bpmngen/)
  bpmngen_request_file: ollama_request.json  # harness outputs inside bpmngen_output_dir (names passed to the harness)
  bpmngen_raw_output_file: raw_model_output.txt
  bpmngen_thinking_file: raw_thinking.txt
  bpmngen_cleaned_file: bpmngen_cleaned_output.txt
  bpmngen_validation_file: validation.json
  bpmngen_meta_file: meta.json
  generated_json_file: generated.json
  generated_bpmn_file: generated.bpmn
  validation_file: validation.json
  evaluation_details_file: evaluation.json   # per case, next to generated.bpmn
  logs: results/logs                      # per run and condition: <condition>_<run_id>.jsonl, then _part2, _part3
                                          # for each resumed part
  evaluation: results/evaluation.csv                    # main threshold, one row per run per condition per case
  evaluation_run_summary: results/evaluation_run_summary.csv  # main threshold, one row per run per condition
  evaluation_summary: results/evaluation_summary.csv    # main threshold, per condition: mean and SD over repetitions
  evaluation_threshold_csv: results/sensitivity/evaluation_threshold_{threshold}.csv  # one file per sweep threshold
  evaluation_sensitivity_summary: results/sensitivity/summary.csv  # per threshold per condition: mean and SD over repetitions
  statistics_dir: results/statistics       # CSV tables of src/statistics.py
  evaluation_trace_csv: results/sensitivity/trace_threshold_{threshold}.csv  # one file per trace_sensitivity_thresholds value
  evaluation_trace_summary: results/sensitivity/trace_summary.csv  # per trace threshold per condition: mean and SD
  rq3_agreement: results/rq3_agreement.csv  # src/rq3_agreement.py: one row per run
  rq3_confusion: results/rq3_confusion.json  # src/rq3_agreement.py: confusion matrix per run
  extended_scoring_csv: results/diagnostics/extended_scoring_study1.csv    # src/extended_scoring.py (new output)
  extended_scoring_report: results/diagnostics/extended_scoring_study1.md  # old vs extended scores (provisional)
  context_check_dir: results/context_check  # src/count_prompt_tokens.py (legacy json_builder generator only)
